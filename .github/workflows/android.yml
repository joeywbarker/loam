name: android-apk

# Builds the phone app and attaches it to every GitHub Release you publish.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then V="${{ github.event.release.tag_name }}"; else V="dev-${{ github.run_number }}"; fi
          echo "LOAM_VERSION=${V#v}" >> "$GITHUB_ENV"

      # Optional stable signing key (lets new APKs install over old ones). See app/android/README.md.
      - name: Prepare signing key (if configured)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/loam.jks"
            echo "LOAM_KEYSTORE=$RUNNER_TEMP/loam.jks" >> "$GITHUB_ENV"
            echo "LOAM_KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
            echo "BUILD_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_GLOB=app/android/app/build/outputs/apk/release/*.apk" >> "$GITHUB_ENV"
          else
            echo "No signing key configured: building a debug-signed APK."
            echo "BUILD_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_GLOB=app/android/app/build/outputs/apk/debug/*.apk" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: gradle -p app/android "$BUILD_TASK" --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp $APK_GLOB "dist/loam-${LOAM_VERSION}.apk"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: loam-apk
          path: dist/*.apk

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.apk --clobber
